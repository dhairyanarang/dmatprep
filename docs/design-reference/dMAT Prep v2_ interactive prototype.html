<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dMAT Prep: UI and flow review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A;--t2:#5F5F5F;--t3:#737373;--line:#E7E7E7;--line2:#DDDDDD;--soft:#EDEDED;--hair:#F0F0EE;
  --side:#F3F2F0;--frame:#F8F7F5;--white:#FFFFFF;
  --blue:#2F4BFF;--blue7:#1F37D9;--blue50:#EEF0FF;--blue100:#DDE2FF;--blue200:#BCC7FF;
  --gold:#F2B33D;--gold7:#E8A82C;--gold50:#FFF5DF;--goldline:#F0D9A6;--goldtext:#8A5A00;--golddark:#3A2600;--goldsoft:#FFFBF2;
  --ok:#16803C;--okbg:#E9F6EE;--okline:#CDEBD8;--oktext:#14672F;
  --bad:#C9372C;--badbg:#FDEEEC;--badline:#F6D3CE;--badtext:#A22A1F;
  --warn:#B26B00;--warnbg:#FFF4E0;--warnline:#F5DFB0;--warntext:#8A4B00;
  --fig-ink:#0A0A0A;--fig-blue:#2F4BFF;--fig-teal:#0F9D8A;--fig-plum:#A63A8C;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Geist,Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:20px;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue7)}
button{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
.over{font-family:var(--mono);font-size:11px;line-height:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);font-weight:500}
.ptitle{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0}
.muted{color:var(--t2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{height:52px;flex:none;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2)}
.brand a{flex:1;display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.logo{width:24px;height:24px;border-radius:5px;background:var(--ink);display:grid;place-items:center;flex:none}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.iconbtn:hover{background:var(--frame)}
.nav{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:16px}
.navgroup{display:flex;flex-direction:column;gap:8px}
.navlabel{font-size:12px;font-weight:600;line-height:14px;padding:0 2px}
.navitem{height:38px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:8px;border:1px solid transparent;color:var(--t2);transition:background .15s}
.navitem:hover{background:#ECEBE8;color:var(--ink)}
.navitem.on{background:var(--white);border-color:var(--line);color:var(--ink);font-weight:600}
.navitem .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t3);font-weight:400}
.divider{height:1px;background:var(--line2)}
.sidebottom{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.upcard{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.procard{background:var(--white);border:1px solid var(--goldline);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.procard:hover{color:var(--ink);border-color:var(--gold)}
.userbtn{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--white);text-align:left;cursor:pointer;width:100%;position:relative}
.userbtn:hover{background:var(--frame)}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--ink);color:#F3F0E6;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,10,10,.14);padding:4px;z-index:30;animation:rise .16s var(--ease) both}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;border:0;background:none;color:var(--ink);cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--frame)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:52px;flex:none;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2);background:var(--white);position:sticky;top:0;z-index:20}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.crumbs a{display:inline-flex;align-items:center;gap:6px;color:var(--t3)}
.crumbs a:hover{color:var(--ink)}
.crumbs b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{flex:0 1 309px;min-width:120px;height:36px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(243,242,240,.6);display:flex;align-items:center;gap:6px;color:var(--t2);cursor:pointer}
.search:hover{border-color:var(--line2)}
.search span:first-of-type{flex:1;text-align:left}
.kbd{height:24px;padding:0 6px;border-radius:4px;background:rgba(0,0,0,.04);display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;color:var(--t2)}
.menubtn{display:none}
.page{padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px;width:100%;flex:1}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}

/* atoms */
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s,box-shadow .2s;text-decoration:none}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue7);color:#fff}
.btn-s{background:var(--white);border-color:var(--line);color:var(--ink)}.btn-s:hover{background:var(--frame);color:var(--ink)}
.btn-d{background:var(--ink);color:#fff}.btn-d:hover{background:#262626;color:#fff}
.btn-pro{background:var(--gold);color:var(--golddark);font-weight:600}.btn-pro:hover{background:var(--gold7);color:var(--golddark);box-shadow:0 6px 18px rgba(242,179,61,.35)}
.btn-danger{background:var(--white);border-color:var(--badline);color:var(--badtext)}.btn-danger:hover{background:var(--badbg)}
.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn-lg{height:44px;padding:0 18px;font-size:15px;border-radius:10px}
.btn:disabled{background:#EDECEA;color:#8C8C8C;border-color:transparent;cursor:not-allowed}
.btn-block{width:100%}
.pro{height:18px;padding:0 6px;border-radius:4px;background:var(--gold);color:var(--golddark);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px;flex:none}
.freebadge{height:18px;padding:0 6px;border-radius:4px;border:1px solid var(--line2);color:var(--t2);font-family:var(--mono);font-size:10px;font-weight:600;display:inline-flex;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:99px;border:1px solid;font-size:12px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:99px;display:block}
.p-ok{background:var(--okbg);border-color:var(--okline);color:var(--oktext)}.p-ok i{background:var(--ok)}
.p-bad{background:var(--badbg);border-color:var(--badline);color:var(--badtext)}.p-bad i{background:var(--bad)}
.p-warn{background:var(--warnbg);border-color:var(--warnline);color:var(--warntext)}.p-warn i{background:var(--warn)}
.p-skip{background:var(--side);border-color:var(--line);color:var(--t2)}.p-skip i{background:#9A9A9A}
.lv{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;display:inline-flex;align-items:center}
.lv-Easy{background:var(--side)}.lv-Medium{background:var(--blue50);color:var(--blue7)}.lv-Hard{background:var(--ink);color:#fff}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--side);border:1px solid var(--line)}
.seg button{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(10,10,10,.08)}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--white);font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:#8E9DFF}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.round{border-radius:99px;height:30px}

/* panels */
.panel{background:var(--frame);border:1px solid var(--line);border-radius:12px;padding:0 4px 4px;display:flex;flex-direction:column;min-width:0}
.panel-h{min-height:44px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.surface{background:var(--white);border:1px solid var(--soft);border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
.kpi{background:var(--frame);border:1px solid var(--line);border-radius:12px;padding:4px;display:flex;flex-direction:column}
.kpi .surface{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.kpi .num{font-family:var(--mono);font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em}
.kpi .foot{min-height:30px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--t2)}
.bar{height:4px;border-radius:99px;background:var(--blue50);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .6s var(--ease)}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);font-weight:500;border-bottom:1px solid var(--soft);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #F3F3F1;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#FAFAF9}
.scrollx{overflow-x:auto}
.listrow{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--hair);color:var(--ink);transition:background .12s}
.listrow:last-child{border-bottom:0}
a.listrow:hover,button.listrow:hover{background:#FAFAF9;color:var(--ink)}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed #E3C98E;border-radius:8px;background:var(--goldsoft);color:var(--ink);cursor:pointer;width:100%;text-align:left;transition:background .15s}
.lockrow:hover{background:var(--gold50)}
.lockrow:hover .lk{transform:rotate(-10deg)}
.lk{transition:transform .2s}
.note{padding:10px 12px;border-radius:8px;background:var(--frame);font-size:13px;line-height:19px;color:#3D3D3D;display:flex;gap:10px;align-items:flex-start}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes wiggle{0%,100%{transform:none}25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheen{0%{background-position:-120% 0}100%{background-position:220% 0}}
@keyframes shackle{0%,30%{transform:translateY(0) rotate(0)}70%{transform:translateY(-5px)}100%{transform:translateY(-5px) rotate(-28deg)}}
@keyframes ring{0%{transform:scale(.6);opacity:0}30%{opacity:.6}100%{transform:scale(1.9);opacity:0}}
@keyframes fillGold{from{background:#fff;color:var(--goldtext)}to{background:var(--gold);color:var(--golddark)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes drawer{from{transform:translateX(-100%)}to{transform:none}}
.rise{animation:rise .24s var(--ease) both}
.pop{animation:pop .3s var(--ease) both}
.shake{animation:shake .32s ease both}
.wiggle{animation:wiggle .36s ease both}
.slide{animation:slideIn .22s var(--ease) both}
.sheen{background-image:linear-gradient(110deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 70%);background-size:200% 100%;background-repeat:no-repeat;animation:sheen 1.6s ease .4s 1 both}
.growbar{transform-origin:bottom;animation:grow .5s var(--ease) both}
.spinner{width:16px;height:16px;border-radius:99px;border:2px solid rgba(58,38,0,.25);border-top-color:var(--golddark);animation:spin .7s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;animation:fade .2s ease both}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 48px);overflow:auto;background:var(--white);border-radius:16px;box-shadow:0 24px 64px rgba(10,10,10,.28);animation:modalIn .32s var(--ease) both;position:relative}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;min-width:280px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(10,10,10,.22);animation:toastIn .22s var(--ease) both}
.toast button{border:0;background:none;color:#9FB0FF;font-weight:500;cursor:pointer;padding:0}
.toast .drain{position:absolute;left:0;right:0;bottom:0;height:2px;background:#9FB0FF;transform-origin:left;animation:drain 3.8s linear both}
.palette{position:fixed;inset:0;background:rgba(10,10,10,.32);z-index:70;display:flex;justify-content:center;padding:12vh 16px 16px;animation:fade .15s ease both}
.palette .box{width:100%;max-width:560px;height:fit-content;background:var(--white);border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 64px rgba(10,10,10,.25);overflow:hidden;animation:modalIn .2s var(--ease) both}
.palette input{width:100%;height:48px;border:0;border-bottom:1px solid var(--soft);padding:0 16px;font-family:inherit;font-size:15px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:360px;overflow:auto}
.palette li button{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left}
.palette li button.on,.palette li button:hover{background:var(--blue50)}

/* review panel */
.procol{border:1.5px solid var(--gold);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:20px;background:linear-gradient(180deg,var(--goldsoft) 0%,#fff 40%);position:relative;transition:transform .2s,box-shadow .2s}.procol:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(138,90,0,.12)}
.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.cardgrid{grid-template-columns:1fr}}
@media (min-width:1280px){body.reviewing #root>div:first-child{margin-right:336px}}
.pbar{position:sticky;top:52px;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--soft);padding:10px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.qdot{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-family:var(--mono);font-size:12px;cursor:pointer;padding:0;transition:transform .1s}
.qdot:hover{border-color:var(--ink)}.qdot.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.pwrap{display:flex;align-items:flex-start;flex:1;min-width:0}
.qlist{flex:1;min-width:0;padding:20px 32px 64px;display:flex;flex-direction:column;gap:16px}
.qlist>*{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
.qcard{scroll-margin:140px;transition:border-color .15s,box-shadow .2s}
.qcard.act{border-color:var(--blue200);box-shadow:0 0 0 3px var(--blue50)}
.qcard.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue100)}
.qcard.skip .qb{opacity:.55}
.qb{padding:16px;display:flex;flex-direction:column;gap:14px}
.qf{min-height:46px;padding:6px 6px 2px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ftile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:10px;border:1px solid var(--line);background:#fff}
.ftile .mono{font-size:10px;color:var(--t3)}
.ftile.q{border:1.5px dashed var(--blue200);background:#F8F9FF}
.arr2{color:#A3A3A3;font-size:13px}
.opt.fig{height:auto;flex-direction:column;align-items:center;padding:8px 10px 10px;gap:6px}
.letter.right{background:#F2FAF5;border-color:var(--ok);color:var(--oktext)}
.letter.wrong{background:#FEF6F5;border-color:var(--bad);color:var(--badtext)}
.letter.dim{color:#A3A3A3}.letter:disabled{cursor:default}
.spanel{flex:none;width:420px;position:sticky;top:var(--ptop,113px);height:calc(100vh - var(--ptop,113px));display:flex;flex-direction:column;border-left:1px solid var(--line2);background:#fff;overflow:auto}
.sp-h{position:sticky;top:0;z-index:1;min-height:52px;padding:0 10px 0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--soft)}
.sp-f{position:sticky;bottom:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-top:1px solid var(--soft)}
@media (max-width:1100px){.spanel{position:fixed;top:0;right:0;bottom:0;height:auto;width:min(420px,100%);z-index:66;box-shadow:-20px 0 60px rgba(10,10,10,.18)}}
@media (max-width:860px){.pbar,.qlist{padding-left:16px;padding-right:16px}.pbar{position:static}}
body.haspanel .review{display:none}
.fseq{display:flex;flex-wrap:wrap;gap:12px}
.fcell{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.fcell figcaption{font-size:10px;color:var(--t3)}
.fbox{display:block;width:96px;height:96px}
.fbox.q{box-sizing:border-box;border:1.5px dashed var(--blue200);border-radius:6px;background:#F8F9FF;display:grid;place-items:center}
.fbox.q b{font-family:var(--mono);font-size:24px;color:var(--blue);font-weight:500}
.fparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px}
.fpart{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--frame);border:1px solid var(--soft)}
.scard{position:relative;transition:border-color .15s,box-shadow .2s,transform .2s}
.scard:hover{border-color:#CFCFCF;box-shadow:0 10px 28px rgba(10,10,10,.07);transform:translateY(-1px)}
.scard:has(.stretch:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.scard .stretch{color:var(--ink)}.scard .stretch:focus-visible{outline:none}
.scard .stretch::after{content:"";position:absolute;inset:0;border-radius:12px;z-index:1}
.scard .go{color:var(--blue);opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s}
.scard:hover .go{opacity:1;transform:none}
.starter{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--frame);border:1px solid var(--line)}
.lockcard{position:relative;z-index:2;padding:12px 14px;border-radius:10px}
.unl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--goldline);background:var(--goldsoft)}
.passage{padding:14px 16px;border-radius:10px;background:var(--frame);border:1px solid var(--soft);font-size:14px;line-height:22px;display:flex;flex-direction:column;gap:10px}
.ptbl{background:#fff;border:1px solid var(--soft);border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden;max-width:420px}
.ptbl th,.ptbl td{padding:8px 12px}
.opt.txt{height:auto;min-height:52px;padding:10px 14px}.opt.txt .v{font-family:inherit;font-size:15px;font-weight:500}
.review{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.review-fab{height:40px;padding:0 14px;border-radius:99px;border:0;background:var(--ink);color:#fff;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(10,10,10,.25)}
.review-fab:hover{background:#262626}
.review-panel{width:320px;max-width:calc(100vw - 32px);max-height:calc(100vh - 90px);overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(10,10,10,.22);animation:rise .2s var(--ease) both}
.review-panel h3{font-size:13px;font-weight:600}
.flow{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--hair)}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.steps a{height:26px;padding:0 8px;border-radius:6px;background:var(--frame);border:1px solid var(--line);color:var(--ink);font-size:12px;display:inline-flex;align-items:center}
.steps a:hover{border-color:var(--blue);color:var(--blue)}
.steps a.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.steps .arr{color:#A3A3A3;font-size:11px}

/* exam */
.exam{min-height:100vh;display:flex;flex-direction:column}
.examtop{min-height:56px;padding:8px 16px 8px 20px;display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.ghostd{height:34px;padding:0 12px;border-radius:8px;border:1px solid #333;background:transparent;color:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ghostd:hover{background:#262626;color:#fff}
.grid5{display:grid;grid-template-columns:repeat(5,56px);grid-auto-rows:56px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--white)}
.grid5 div{display:grid;place-items:center;font-family:var(--mono);font-size:20px;font-weight:500;border-right:1px solid #E0E0E0;border-bottom:1px solid #E0E0E0}
.grid5 div:nth-child(5n){border-right:0}
.grid5 div:nth-last-child(-n+5){border-bottom:0}

.grid5 .tgt{background:var(--blue);color:#fff}
.letter{height:52px;min-width:52px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-family:var(--mono);font-size:18px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.letter:hover{border-color:#8E9DFF}
.letter:active{transform:scale(.96)}
.letter.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tile{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--white);font-family:var(--mono);font-size:12px;color:var(--t2);cursor:pointer;position:relative;padding:0}
.tile:hover{border-color:var(--ink)}
.tile.done{background:var(--blue);border-color:var(--blue);color:#fff}
.tile.cur{border:1.5px solid var(--ink)}
.tile .f{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:99px;background:var(--warn)}

/* practice */
.opt{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--white);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:#8E9DFF}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--t2);background:var(--frame);flex:none}
.opt .v{flex:1;font-family:var(--mono);font-size:18px;font-weight:500}
.opt .tag{font-size:12px;font-weight:500}
.opt.right{background:#F2FAF5;border-color:var(--ok);color:var(--oktext)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:#FEF6F5;border-color:var(--bad);color:var(--badtext)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{color:#8C8C8C}
.opt:disabled{cursor:default}
.eq{padding:12px 14px;border-radius:8px;background:var(--frame);border:1px solid var(--soft);font-family:var(--mono);font-size:18px;font-weight:500}
.eq.key{background:var(--blue50);border-color:#8E9DFF}

/* responsive */
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:65;transform:translateX(-100%);transition:transform .25s var(--ease)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,10,10,.35)}
  .menubtn{display:grid}
  .page{padding:20px 16px 96px}
  .search span:first-of-type,.search .kbd{display:none}
  .search{flex:none;width:36px;min-width:36px;padding:0;justify-content:center}
}

document.addEventListener('input',e=>{if(e.target.id==='palin'){palQ=e.target.value;palI=0;render()}});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette?A.closePalette():A.palette();return}
  if(e.key==='Escape'){if(S.palette)return A.closePalette();if(S.route==='practice'&&S.panel)return A.pClose();if(S.paywall)return A.closePaywall();if(S.confirmSubmit)return A.closeConfirm();if(S.review)return A.review();if(S.menu)return A.menu()}
  if(S.palette){const it=palItems();if(e.key==='ArrowDown'){palI=Math.min(palI+1,it.length-1);render();e.preventDefault()}if(e.key==='ArrowUp'){palI=Math.max(palI-1,0);render();e.preventDefault()}if(e.key==='Enter'&&it[palI]){A.palGo(it[palI][0])}return}
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
  if(S.route==='practice'){const id=pActive();const q=id&&qById(id)[1];const n=parseInt(e.key,10);const k=e.key.toLowerCase();
    if(k==='escape'&&S.panel)return A.pClose();
    if(q&&n>=1&&!pDone(q)){const part=isFS(q)?(pPick(q)[0]==null?0:1):0;const max=isFS(q)?3:q.opts.length;if(n<=max){A.pAns(id+'|'+part+'|'+(n-1));if(pDone(q)&&!S.panel){const nx=pList().find(x=>pState(x.id)==='todo');if(nx)setTimeout(()=>pScroll(nx.id),450)}}}
    if(q&&k==='h')A.pHint(id)}
  if(S.route==='exam'){if('abcde'.includes(e.key.toLowerCase())&&e.key.length===1)A.examPick(e.key.toUpperCase());if(e.key==='ArrowRight')A.examGo(S.exam.task+1);if(e.key==='ArrowLeft')A.examGo(S.exam.task-1)}
});
if(!location.hash)history.replaceState(null,'','#home');
try{S.review=!localStorage.getItem('dmatv2-seen');localStorage.setItem('dmatv2-seen','1')}catch(e){S.review=true}
syncRoute();
</script>
</body>
</html>
